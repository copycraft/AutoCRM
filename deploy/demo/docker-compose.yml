# AutoCRM showcase on one Ubuntu box. Point your tunnel at the two host ports below
# (web app and file storage), or use the bundled cloudflared (--profile cloudflared).
# See README.md.
name: autocrm-demo

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: autocrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: autocrm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocrm"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible file storage (SeaweedFS). One access key, written from .env at start.
  s3:
    image: chrislusf/seaweedfs:latest
    entrypoint: >
      /bin/sh -c "
      printf '{\"identities\":[{\"name\":\"autocrm\",\"credentials\":[{\"accessKey\":\"autocrm\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]}]}' \"$${S3_SECRET_KEY}\" > /etc/s3.json &&
      exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/s3.json
      "
    environment:
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - s3data:/data
    ports:
      - "${BIND_IP:-127.0.0.1}:${FILES_PORT:-9000}:9000"

  # Creates the bucket. No object lock: demo photos must be deletable (S3_INTAKE_LOCK_YEARS=0).
  s3-init:
    image: amazon/aws-cli:latest
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: autocrm
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://s3:9000 s3api list-buckets >/dev/null 2>&1; do sleep 2; done;
      aws --endpoint-url http://s3:9000 s3api head-bucket --bucket autocrm 2>/dev/null ||
      aws --endpoint-url http://s3:9000 s3api create-bucket --bucket autocrm
      "

  migrate:
    build: { context: ../.., dockerfile: deploy/demo/backend.Dockerfile }
    image: autocrm-demo-backend
    command: ["autocrm", "migrate"]
    env_file: backend.env
    environment: &backend-env
      DATABASE_URL: postgres://autocrm:${POSTGRES_PASSWORD}@postgres:5432/autocrm
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: https://${FILES_HOST}
      PUBLIC_BASE_URL: https://${APP_HOST}
      ALLOWED_ORIGINS: https://${APP_HOST}
      UPLOAD_SIGNING_KEY: ${UPLOAD_SIGNING_KEY}
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    image: autocrm-demo-backend
    env_file: backend.env
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3-init: { condition: service_completed_successfully }

  frontend:
    build:
      context: ../..
      dockerfile: deploy/demo/frontend.Dockerfile
      args:
        AUTOCRM_S3_URL: https://${FILES_HOST}
    ports:
      - "${BIND_IP:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on: [backend]

  # Optional: only with --profile cloudflared (TUNNEL_TOKEN set). Public hostnames are
  # set in the Cloudflare dashboard (README.md):
  #   APP_HOST   -> http://frontend:3000
  #   FILES_HOST -> http://s3:9000
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [cloudflared]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [frontend, s3]

volumes:
  pgdata:
  s3data:
