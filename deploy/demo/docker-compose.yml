# AutoCRM showcase on one Ubuntu box. Point your tunnel at the two host ports below
# (web app and file storage), or use the bundled cloudflared (--profile cloudflared).
# See README.md.
name: autocrm-demo

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: autocrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: autocrm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocrm"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: autocrm
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      - "${BIND_IP:-127.0.0.1}:${FILES_PORT:-9000}:9000"

  # No object lock: demo photos must be deletable on reset (S3_INTAKE_LOCK_YEARS=0).
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 autocrm $${S3_SECRET_KEY}; do sleep 1; done;
      mc mb --ignore-existing local/autocrm;
      exit 0;
      "
    environment:
      S3_SECRET_KEY: ${S3_SECRET_KEY}

  migrate:
    build: { context: ../.., dockerfile: deploy/demo/backend.Dockerfile }
    image: autocrm-demo-backend
    command: ["autocrm", "migrate"]
    env_file: backend.env
    environment: &backend-env
      DATABASE_URL: postgres://autocrm:${POSTGRES_PASSWORD}@postgres:5432/autocrm
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: https://${FILES_HOST}
      PUBLIC_BASE_URL: https://${APP_HOST}
      ALLOWED_ORIGINS: https://${APP_HOST}
      UPLOAD_SIGNING_KEY: ${UPLOAD_SIGNING_KEY}
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    image: autocrm-demo-backend
    env_file: backend.env
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }

  frontend:
    build:
      context: ../..
      dockerfile: deploy/demo/frontend.Dockerfile
      args:
        AUTOCRM_S3_URL: https://${FILES_HOST}
    ports:
      - "${BIND_IP:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on: [backend]

  # Optional: only with --profile cloudflared (TUNNEL_TOKEN set). Public hostnames are
  # set in the Cloudflare dashboard (README.md):
  #   APP_HOST   -> http://frontend:3000
  #   FILES_HOST -> http://minio:9000
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [cloudflared]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [frontend, minio]

volumes:
  pgdata:
  miniodata:
