name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autocrm
          POSTGRES_PASSWORD: autocrm
          POSTGRES_DB: autocrm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autocrm"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      # Compile-time query checking against the committed .sqlx metadata;
      # the live database is used by #[sqlx::test] integration tests.
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://autocrm:autocrm@localhost:5432/autocrm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The committed OpenAPI document is verified current by the backend
      # `committed_openapi_document_is_current` test; regenerating here and
      # failing on any diff keeps the generated client in lockstep with it.
      - run: npm run gen:api
      - run: git diff --exit-code -- src/lib/api/schema.gen.ts src/lib/api/zod
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
