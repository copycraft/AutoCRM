[package]
name = "autocrm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
default-run = "autocrm"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
aws-sdk-s3 = "1"
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
cookie = "0.18"
# ZIP downloads: the checksum each entry carries. Already in the tree through png.
crc32fast = "1"
# Two-factor codes (TOTP is HMAC-SHA1 by RFC 6238), and sealing stored secrets. All three are
# already in the tree (aws-sdk, rustls).
hkdf = "0.12"
ring = "0.17"
sha1 = "0.10"
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
kamadak-exif = "0.6"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
mail-parser = "0.11"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
quick-xml = "0.37"
rand = "0.9"
# V7.2: the vehicle plate may live only inside MiniCRM project names, so the migration
# mapping can carry a user-supplied extraction pattern. Already in the lock file via
# tracing-subscriber's env-filter.
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "rust_decimal", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "limit", "catch-panic", "compression-gzip"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5.5", features = ["chrono", "decimal", "preserve_order", "preserve_path_order"] }
utoipa-axum = "0.2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "0.26"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.dev.package."*"]
# Image decoding and argon2 are unbearably slow unoptimised; our own code stays debuggable.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
