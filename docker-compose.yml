# Local development services. Production runs the same three things on one host:
# the autocrm binary, Postgres, and an S3-compatible object store.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: autocrm
      POSTGRES_PASSWORD: autocrm
      POSTGRES_DB: autocrm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocrm"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: autocrm
      MINIO_ROOT_PASSWORD: autocrm-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Creates the bucket with object locking enabled (required for write-once intake photos).
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 autocrm autocrm-dev-secret; do sleep 1; done;
      mc mb --ignore-existing --with-lock local/autocrm;
      mc version enable local/autocrm;
      exit 0;
      "

  # Wraps NAV's Online Számla system (XML, signatures, token exchange) behind a
  # small JSON API, so the Rust backend never handles any of it. Defaults to
  # MOCK_MODE: an in-process fake NAV, no credentials, nothing reported for real.
  # Real credentials and the endpoint shapes: nav-sidecar/README.md.
  nav-sidecar:
    build: ./nav-sidecar
    init: true
    environment:
      MOCK_MODE: "true"
      PORT: "8080"
      NAV_ENVIRONMENT: test
      # Every route but /health needs "Authorization: Bearer <this>". Dev value only;
      # the backend sends it as NAV_SIDECAR_TOKEN (backend/.env.example).
      SIDECAR_TOKEN: dev-sidecar-token-not-for-production-0000
      # Unset MOCK_MODE and set these to report to the real test system:
      # NAV_LOGIN, NAV_PASSWORD, NAV_SIGN_KEY, NAV_EXCHANGE_KEY, NAV_TAX_NUMBER,
      # NAV_SOFTWARE_ID, NAV_SOFTWARE_NAME, NAV_SOFTWARE_DEV_CONTACT.
    ports:
      # 8081 on the host (the backend takes 8080), loopback only: nothing on the
      # network should reach a service that acts under the company's NAV credentials.
      - "127.0.0.1:8081:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["nav"]

  # Local SMTP sink for testing EMAIL_MODE=smtp without reaching real inboxes. UI on :8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    profiles: ["mail"]

  # The assistant's language model: Qwen2.5-0.5B-Instruct (494M parameters, 4-bit, ~400 MB)
  # on llama.cpp's OpenAI-compatible server, CPU only. `--jinja` turns on tool calling.
  # The model is fetched from Hugging Face on first start and kept in the `models` volume.
  # Point the backend at it with AI_URL=http://127.0.0.1:8082.
  ai:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      -hf Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M
      --jinja --ctx-size 8192 --parallel 2 --threads 4
      --host 0.0.0.0 --port 8080
    environment:
      LLAMA_CACHE: /models
    ports:
      # 8082 on the host: 8080 is the backend, 8081 the NAV sidecar, and both profiles
      # may run at once. Loopback only: the model server has no authentication.
      - "127.0.0.1:8082:8080"
    volumes:
      - models:/models
    profiles: ["ai"]

volumes:
  pgdata:
  miniodata:
  models:
